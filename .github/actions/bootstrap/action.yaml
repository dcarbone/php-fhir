name: 'Bootstrap'
description: 'Installs PHP and the Composer dependencies, with the PHPUnit version matching the PHP version'

inputs:
  php-version:
    required: true
    description: 'PHP version to use for tests'

runs:
  using: "composite"
  steps:
    - name: 'Define vars'
      id: "vars"
      env:
        PHP_VERSION: '${{ inputs.php-version }}'
      shell: "bash -e {0}"
      # language=sh
      run: |
        _phpunit_version=
        case "${PHP_VERSION}" in
          8.1) _phpunit_version='10.5' ;;
          8.2) _phpunit_version='11.1' ;;
          8.3) _phpunit_version='11.1' ;;
          8.4) _phpunit_version='13.0' ;;
          8.5) _phpunit_version='13.0' ;;
          *) echo "Unsupported PHP version: ${PHP_VERSION}" && exit 1 ;;
        esac
        echo "phpunit-version=${_phpunit_version}" >> $GITHUB_OUTPUT

    - name: 'Install PHP'
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: '${{ inputs.php-version }}'
        extensions: "libxml simplexml json zip"
        ini-values: "precision=20 memory_limit=1G"

    - name: 'Install jq'
      uses: "dcarbone/install-jq-action@v4"
      with:
        force: true

    - name: 'Set composer dep versions'
      env:
        PHPUNIT_VERSION: '${{ steps.vars.outputs.phpunit-version }}'
      shell: "bash -e {0}"
      # language=sh
      run: |
        tmpf="$(mktemp)"
        jq -rcM ".\"require-dev\".\"phpunit/phpunit\" = \"^${PHPUNIT_VERSION}\"" composer.json > "${tmpf}"
        mv "${tmpf}" composer.json

    - name: 'Get composer cache directory'
      id: "composer-cache"
      shell: "bash -e {0}"
      # language=sh
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: 'Init composer dep cache'
      id: "cache"
      uses: "actions/cache@v6"
      with:
        path: '${{ steps.composer-cache.outputs.dir }}'
        key: "composer-${{ runner.os }}-${{ inputs.php-version }}-${{ steps.vars.outputs.phpunit-version }}-${{ hashFiles('composer.lock') }}"

    - name: 'Install composer deps'
      shell: "bash -e {0}"
      # language=sh
      run: |
        rm composer.lock
        composer update --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: 'Save composer dep cache'
      if: "steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != true"
      uses: "actions/cache/save@v6"
      with:
        path: '${{ steps.composer-cache.outputs.dir }}'
        key: "composer-${{ runner.os }}-${{ inputs.php-version }}-${{ steps.vars.outputs.phpunit-version }}-${{ hashFiles('composer.lock') }}"

