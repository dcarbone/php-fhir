name: "Tests"

permissions:
  actions: "none"
  attestations: "none"
  checks: "none"
  contents: "read"
  deployments: "none"
  id-token: "none"
  issues: "none"
  models: "none"
  discussions: "none"
  packages: "none"
  pages: "none"
  pull-requests: "none"
  security-events: "none"
  statuses: "none"

on:
  workflow_dispatch:

  push:
    branches:
      - "main"
    paths:
      - '.github/workflows/tests.yaml'
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit/**.xml'
      - 'phpunit.xml'

  pull_request:
    branches:
      - "main"
    paths:
      - '.github/workflows/tests.yaml'
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit/**.xml'
      - 'phpunit.xml'

jobs:
  builder-tests:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    name: 'Builder Tests - PHP ${{ matrix.php-version }}'
    steps:
      - uses: "actions/checkout@v7"
      - name: 'Bootstrap'
        uses: "./.github/actions/bootstrap"
        with:
          php-version: '${{ matrix.php-version }}'

      - name: 'Run tests'
        # language=sh
        run: "./vendor/bin/phpunit -c 'phpunit/Builder.xml'"

  load-fhir-source:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: true
      matrix:
        test-target:
          - 'DSTU1'
          - 'DSTU2'
          - 'STU3'
          - 'R4'
          - 'R4B'
          - 'R5'
    name: 'Download ${{ matrix.test-target }} Source'
    steps:
      - uses: "actions/checkout@v7"
      - uses: "./.github/actions/load-fhir-xsd"
        with:
          version: '${{ matrix.test-target }}'

  run:
    runs-on: "ubuntu-latest"
    needs:
      - "load-fhir-source"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        test-target:
          - 'Core'
          - 'DSTU1'
          - 'DSTU2'
          - 'STU3'
          - 'R4'
          - 'R4B'
          - 'R5'
    name: '${{ matrix.test-target }} - PHP ${{ matrix.php-version }}'
    services:
      php-fhir-test-server:
        image: "ghcr.io/dcarbone/php-fhir-test-server:latest"
        ports:
          - '8080:8080'
    steps:
      - uses: "actions/checkout@v7"
      - name: 'Bootstrap'
        uses: "./.github/actions/bootstrap"
        with:
          php-version: '${{ matrix.php-version }}'
      - name: 'Load FHIR ${{ matrix.test-target }} Source'
        id: "fhir-source"
        if: "matrix.test-target != 'Core'"
        uses: "./.github/actions/load-fhir-xsd"
        with:
          version: '${{ matrix.test-target }}'
      - name: 'Run tests'
        env:
          TEST_TARGET: '${{ matrix.test-target }}'
        # language=sh
        run: |
          ./vendor/bin/phpunit -c "phpunit/${TEST_TARGET}.xml"
      - name: 'Restore Rector cache'
        # Only meaningful when the Rector step below actually runs (see its comment). Keyed per
        # test-target since each target's generated tree is distinct; the run-id suffix on `key`
        # guarantees a save every run, while `restore-keys` picks up the most recent prior cache
        # for that target to seed it.
        if: "matrix.php-version == '8.3'"
        uses: "actions/cache@v6"
        with:
          path: ".rector-cache/generated"
          key: "rector-generated-${{ matrix.test-target }}-${{ github.run_id }}"
          restore-keys: |
            rector-generated-${{ matrix.test-target }}-
      - name: 'Rector quality gate on generated output'
        # Generated output differs only per test-target, not per PHP version, so this only needs
        # to run once per target rather than once per (php-version, test-target) matrix cell.
        # Starts lenient (non-blocking) per php-fhir#198; flip to blocking once proven noise-free.
        if: "matrix.php-version == '8.3'"
        continue-on-error: true
        # language=sh
        run: composer rector:generated:dry-run
