name: "Benchmarks"

# Benchmarks run against the generated code AFTER the Rector pass, mirroring publish-generated.yaml, since that is what
# consumers receive.
#
# Memory regressions are asserted by the PHPUnit "Benchmarks" suite (deterministic, compared against the committed
# baselines in benchmarks/baselines).  Timing is far too noisy on shared runners to assert, so the full result set is
# instead recorded as a trend and compared against the previous run on main, alerting on large regressions.

permissions:
  actions: "none"
  attestations: "none"
  checks: "none"
  contents: "write"
  deployments: "none"
  id-token: "none"
  issues: "none"
  models: "none"
  discussions: "none"
  packages: "none"
  pages: "none"
  pull-requests: "write"
  security-events: "none"
  statuses: "none"

on:
  workflow_dispatch:

  push:
    branches:
      - "main"
    paths:
      - '.github/workflows/benchmarks.yaml'
      - 'benchmarks/**'
      - 'phpunit/Benchmarks.xml'
      - 'src/**'
      - 'template/**'
      - 'composer.json'

  pull_request:
    branches:
      - "main"
    paths:
      - '.github/workflows/benchmarks.yaml'
      - 'benchmarks/**'
      - 'phpunit/Benchmarks.xml'
      - 'src/**'
      - 'template/**'
      - 'composer.json'

jobs:
  benchmarks:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # Baselines are per PHP minor version (see benchmarks/baselines); add a version here once its baselines exist.
        php-version:
          - '8.3'
        test-target:
          - 'DSTU2'
          - 'STU3'
          - 'R4'
          - 'R4B'
          - 'R5'
    name: 'Benchmarks ${{ matrix.test-target }} - PHP ${{ matrix.php-version }}'
    steps:
      - uses: "actions/checkout@v7"
      - name: 'Bootstrap'
        uses: "./.github/actions/bootstrap"
        with:
          php-version: '${{ matrix.php-version }}'
      - name: 'Load FHIR ${{ matrix.test-target }} Source'
        uses: "./.github/actions/load-fhir-xsd"
        with:
          version: '${{ matrix.test-target }}'

      - name: 'Run php-fhir generator'
        env:
          TEST_TARGET: '${{ matrix.test-target }}'
          PHPFHIR_TEST_TARGET: '${{ matrix.test-target }}'
        # phpunit/config.php only references the target version's schema path; bin/config.php requires every version's
        # input to exist, but only the target is downloaded here.
        # language=sh
        run: |
          php bin/generate.php \
            --config phpunit/config.php \
            --versions "${TEST_TARGET}" \
            --logLevel warning

      - name: 'Restore Rector cache'
        uses: "actions/cache@v6"
        with:
          path: ".rector-cache/generated"
          key: "rector-generated-bench-${{ matrix.test-target }}-${{ github.run_id }}"
          restore-keys: |
            rector-generated-bench-${{ matrix.test-target }}-

      - name: 'Run Rector on generated output'
        # language=sh
        run: "composer rector:generated"

      - name: 'Memory regression tests'
        env:
          PHPFHIR_TEST_TARGET: '${{ matrix.test-target }}'
          # Skip regeneration so the Rector-transformed output is what actually gets measured.
          PHPFHIR_TEST_SKIP_GENERATE: "true"
        # language=sh
        run: "./vendor/bin/phpunit -c 'phpunit/Benchmarks.xml'"

      - name: 'Run benchmarks'
        env:
          TEST_TARGET: '${{ matrix.test-target }}'
        # language=sh
        run: |
          php benchmarks/run.php \
            --version="${TEST_TARGET}" \
            --sizes=200,1000 \
            --iterations=5 \
            --github-action-benchmark="${RUNNER_TEMP}/benchmark-results.json"

      - name: 'Upload results'
        uses: "actions/upload-artifact@v7"
        with:
          name: 'benchmark-${{ matrix.test-target }}-php${{ matrix.php-version }}'
          path: '${{ runner.temp }}/benchmark-results.json'
          if-no-files-found: "error"
          retention-days: 7

      # Pull requests compare against the history on gh-pages but never publish; only the publish job below writes it.
      - name: 'Restore tracked files'
        if: "github.event_name == 'pull_request'"
        # The bootstrap action rewrites composer.json and removes composer.lock; the compare step must switch to
        # gh-pages and refuses to do so with a dirty working tree. Untracked/ignored output is left untouched.
        # language=sh
        run: "git checkout -- ."

      - name: 'Compare against history'
        if: "github.event_name == 'pull_request'"
        uses: "benchmark-action/github-action-benchmark@v1"
        with:
          name: 'Unserialize ${{ matrix.test-target }} (PHP ${{ matrix.php-version }})'
          tool: 'customSmallerIsBetter'
          output-file-path: '${{ runner.temp }}/benchmark-results.json'
          benchmark-data-dir-path: 'benchmarks/${{ matrix.test-target }}-php${{ matrix.php-version }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

  # Publishes every matrix result to gh-pages as ONE signed commit. Doing it per matrix job raced on the branch, and the
  # action's own commits are unsigned, which the branch protection rejects.
  publish:
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    needs: "benchmarks"
    runs-on: "ubuntu-latest"
    concurrency:
      group: "benchmarks-publish"
      cancel-in-progress: false
    steps:
      # The concurrency group only serializes publishers, it does not order them by commit. A run that finishes after a
      # newer commit has landed on main would append stale data (the action compares against the last stored result),
      # so superseded commits skip publishing. This runs once the concurrency lock is held, i.e. immediately before
      # any write.
      - name: 'Check commit is still main head'
        id: "head"
        env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          COMMIT_SHA: '${{ github.sha }}'
        # language=sh
        run: |
          _head="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"
          if [ "${_head}" = "${COMMIT_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${COMMIT_SHA} is superseded by ${_head}; skipping benchmark publish."
          fi

      - uses: "actions/checkout@v7"
        if: "steps.head.outputs.current == 'true'"

      - uses: "actions/download-artifact@v8"
        if: "steps.head.outputs.current == 'true'"
        with:
          pattern: "benchmark-*"
          path: "${{ runner.temp }}/results"

      # The action is invoked once per result set with auto-push disabled, so it only commits locally; the commits are
      # then squashed and signed below. The PHP version in the names/paths must match the benchmarks matrix.
      - name: 'Record DSTU2'
        if: "steps.head.outputs.current == 'true'"
        uses: "benchmark-action/github-action-benchmark@v1"
        with:
          name: 'Unserialize DSTU2 (PHP 8.3)'
          tool: 'customSmallerIsBetter'
          output-file-path: '${{ runner.temp }}/results/benchmark-DSTU2-php8.3/benchmark-results.json'
          benchmark-data-dir-path: 'benchmarks/DSTU2-php8.3'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: 'Record STU3'
        if: "steps.head.outputs.current == 'true'"
        uses: "benchmark-action/github-action-benchmark@v1"
        with:
          name: 'Unserialize STU3 (PHP 8.3)'
          tool: 'customSmallerIsBetter'
          output-file-path: '${{ runner.temp }}/results/benchmark-STU3-php8.3/benchmark-results.json'
          benchmark-data-dir-path: 'benchmarks/STU3-php8.3'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: 'Record R4'
        if: "steps.head.outputs.current == 'true'"
        uses: "benchmark-action/github-action-benchmark@v1"
        with:
          name: 'Unserialize R4 (PHP 8.3)'
          tool: 'customSmallerIsBetter'
          output-file-path: '${{ runner.temp }}/results/benchmark-R4-php8.3/benchmark-results.json'
          benchmark-data-dir-path: 'benchmarks/R4-php8.3'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: 'Record R4B'
        if: "steps.head.outputs.current == 'true'"
        uses: "benchmark-action/github-action-benchmark@v1"
        with:
          name: 'Unserialize R4B (PHP 8.3)'
          tool: 'customSmallerIsBetter'
          output-file-path: '${{ runner.temp }}/results/benchmark-R4B-php8.3/benchmark-results.json'
          benchmark-data-dir-path: 'benchmarks/R4B-php8.3'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
      - name: 'Record R5'
        if: "steps.head.outputs.current == 'true'"
        uses: "benchmark-action/github-action-benchmark@v1"
        with:
          name: 'Unserialize R5 (PHP 8.3)'
          tool: 'customSmallerIsBetter'
          output-file-path: '${{ runner.temp }}/results/benchmark-R5-php8.3/benchmark-results.json'
          benchmark-data-dir-path: 'benchmarks/R5-php8.3'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - name: 'Sign and push gh-pages'
        if: "steps.head.outputs.current == 'true'"
        env:
          SSH_SIGNING_KEY: '${{ secrets.SSH_SIGNING_KEY }}'
          COMMIT_SHA: '${{ github.sha }}'
        # language=sh
        run: |
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${SSH_SIGNING_KEY}" > "${HOME}/.ssh/signing_key"
          chmod 600 "${HOME}/.ssh/signing_key"
          ssh-keygen -y -f "${HOME}/.ssh/signing_key" > "${HOME}/.ssh/signing_key.pub"

          git config user.name 'Daniel Carbone (PHPFHIR Generator)'
          git config user.email '1392439+dcarbone@users.noreply.github.com'
          git config gpg.format ssh
          git config user.signingkey "${HOME}/.ssh/signing_key"

          git fetch origin gh-pages
          git checkout gh-pages
          # Collapse the action's unsigned local commits into one signed commit on top of the remote tip.
          git reset --soft FETCH_HEAD
          if git diff --cached --quiet; then
            echo "No benchmark changes to publish."
            exit 0
          fi
          git commit -S -m "add benchmark results for ${COMMIT_SHA}"

          _attempt=1
          until git push origin gh-pages:gh-pages; do
            if [ "${_attempt}" -ge 3 ]; then
              echo "::error::Failed to push gh-pages after 3 attempts." >&2
              exit 1
            fi
            _attempt=$((_attempt + 1))
            git fetch origin gh-pages
            git rebase -S FETCH_HEAD
          done
