name: "Benchmarks"

# Benchmarks run against the generated code AFTER the Rector pass, mirroring publish-generated.yaml, since that is what
# consumers receive.
#
# Memory regressions are asserted by the PHPUnit "Benchmarks" suite (deterministic, compared against the committed
# baselines in benchmarks/baselines).  Timing is far too noisy on shared runners to assert, so the full result set is
# instead recorded as a trend and compared against the previous run on main, alerting on large regressions.

permissions:
  actions: "none"
  attestations: "none"
  checks: "none"
  contents: "write"
  deployments: "none"
  id-token: "none"
  issues: "none"
  models: "none"
  discussions: "none"
  packages: "none"
  pages: "none"
  pull-requests: "write"
  security-events: "none"
  statuses: "none"

on:
  workflow_dispatch:

  push:
    branches:
      - "main"
    paths:
      - '.github/workflows/benchmarks.yaml'
      - 'benchmarks/**'
      - 'phpunit/Benchmarks.xml'
      - 'src/**'
      - 'template/**'
      - 'composer.json'

  pull_request:
    branches:
      - "main"
    paths:
      - '.github/workflows/benchmarks.yaml'
      - 'benchmarks/**'
      - 'phpunit/Benchmarks.xml'
      - 'src/**'
      - 'template/**'
      - 'composer.json'

jobs:
  benchmarks:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # Baselines are per PHP minor version (see benchmarks/baselines); add a version here once its baselines exist.
        php-version:
          - '8.3'
        test-target:
          - 'DSTU2'
          - 'STU3'
          - 'R4'
          - 'R4B'
          - 'R5'
    name: 'Benchmarks ${{ matrix.test-target }} - PHP ${{ matrix.php-version }}'
    steps:
      - uses: "actions/checkout@v7"
      - name: 'Bootstrap'
        uses: "./.github/actions/bootstrap"
        with:
          php-version: '${{ matrix.php-version }}'
      - name: 'Load FHIR ${{ matrix.test-target }} Source'
        uses: "./.github/actions/load-fhir-xsd"
        with:
          version: '${{ matrix.test-target }}'

      - name: 'Run php-fhir generator'
        env:
          TEST_TARGET: '${{ matrix.test-target }}'
          PHPFHIR_TEST_TARGET: '${{ matrix.test-target }}'
        # phpunit/config.php only references the target version's schema path; bin/config.php requires every version's
        # input to exist, but only the target is downloaded here.
        # language=sh
        run: |
          php bin/generate.php \
            --config phpunit/config.php \
            --versions "${TEST_TARGET}" \
            --logLevel warning

      - name: 'Restore Rector cache'
        uses: "actions/cache@v6"
        with:
          path: ".rector-cache/generated"
          key: "rector-generated-bench-${{ matrix.test-target }}-${{ github.run_id }}"
          restore-keys: |
            rector-generated-bench-${{ matrix.test-target }}-

      - name: 'Run Rector on generated output'
        # language=sh
        run: "composer rector:generated"

      - name: 'Memory regression tests'
        env:
          PHPFHIR_TEST_TARGET: '${{ matrix.test-target }}'
          # Skip regeneration so the Rector-transformed output is what actually gets measured.
          PHPFHIR_TEST_SKIP_GENERATE: "true"
        # language=sh
        run: "./vendor/bin/phpunit -c 'phpunit/Benchmarks.xml'"

      - name: 'Run benchmarks'
        env:
          TEST_TARGET: '${{ matrix.test-target }}'
        # language=sh
        run: |
          php benchmarks/run.php \
            --version="${TEST_TARGET}" \
            --sizes=200,1000 \
            --iterations=5 \
            --github-action-benchmark="${RUNNER_TEMP}/benchmark-results.json"

      - name: 'Upload results'
        uses: "actions/upload-artifact@v7"
        with:
          name: 'benchmark-${{ matrix.test-target }}-php${{ matrix.php-version }}'
          path: '${{ runner.temp }}/benchmark-results.json'
          if-no-files-found: "error"
          retention-days: 7

  # Merges every matrix result into one result set and records it with a single call of the trend action, so history gets
  # one entry (and, on main, one signed commit) per source commit. Doing it per matrix job raced on gh-pages, and the
  # action's own commits are unsigned, which the branch protection rejects. Metric names already carry the version.
  report:
    needs: "benchmarks"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the benchmarks job; one result set, history entry and gh-pages directory per PHP version.
        php-version:
          - '8.3'
          - '8.4'
          - '8.5'
    name: 'Report - PHP ${{ matrix.php-version }}'
    concurrency:
      group: "benchmarks-report-${{ github.event_name }}-${{ github.ref }}-php${{ matrix.php-version }}"
      cancel-in-progress: false
    steps:
      # Concurrency only serializes publishers, it does not order them by commit. A run that finishes after a newer
      # commit has landed on main would append stale data, so superseded commits skip publishing. Pull requests never
      # publish and always proceed.
      - name: 'Check commit is still main head'
        id: "head"
        env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          COMMIT_SHA: '${{ github.sha }}'
          EVENT_NAME: '${{ github.event_name }}'
        # language=sh
        run: |
          if [ "${EVENT_NAME}" != "push" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          _head="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"
          if [ "${_head}" = "${COMMIT_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${COMMIT_SHA} is superseded by ${_head}; skipping benchmark publish."
          fi

      - uses: "actions/checkout@v7"
        if: "steps.head.outputs.current == 'true'"

      - uses: "actions/download-artifact@v8"
        if: "steps.head.outputs.current == 'true'"
        with:
          pattern: "benchmark-*-php${{ matrix.php-version }}"
          path: "${{ runner.temp }}/results"

      - name: 'Merge results'
        if: "steps.head.outputs.current == 'true'"
        env:
          RESULTS_DIR: '${{ runner.temp }}/results'
          PHP_VERSION: '${{ matrix.php-version }}'
          MERGED: '${{ runner.temp }}/benchmark-merged.json'
        # language=sh
        run: |
          for _v in DSTU2 STU3 R4 R4B R5; do
            test -s "${RESULTS_DIR}/benchmark-${_v}-php${PHP_VERSION}/benchmark-results.json" || { echo "::error::Missing results for ${_v}" >&2; exit 1; }
          done
          jq -s 'add' "${RESULTS_DIR}"/benchmark-*/benchmark-results.json > "${MERGED}"
          jq 'length' "${MERGED}"

      # Pull requests: compare only. Main: the action commits locally (unsigned) and the commit is re-signed below.
      - name: 'Record results'
        if: "steps.head.outputs.current == 'true'"
        uses: "benchmark-action/github-action-benchmark@v1"
        with:
          name: 'Unserialize (PHP ${{ matrix.php-version }})'
          tool: 'customSmallerIsBetter'
          output-file-path: '${{ runner.temp }}/benchmark-merged.json'
          benchmark-data-dir-path: 'benchmarks/php${{ matrix.php-version }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: 'Sign and push gh-pages'
        if: "steps.head.outputs.current == 'true' && github.event_name == 'push'"
        env:
          SSH_SIGNING_KEY: '${{ secrets.SSH_SIGNING_KEY }}'
          COMMIT_SHA: '${{ github.sha }}'
        # language=sh
        run: |
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${SSH_SIGNING_KEY}" > "${HOME}/.ssh/signing_key"
          chmod 600 "${HOME}/.ssh/signing_key"
          ssh-keygen -y -f "${HOME}/.ssh/signing_key" > "${HOME}/.ssh/signing_key.pub"

          git config user.name 'Daniel Carbone (PHPFHIR Generator)'
          git config user.email '1392439+dcarbone@users.noreply.github.com'
          git config gpg.format ssh
          git config user.signingkey "${HOME}/.ssh/signing_key"

          # Replace the action's single unsigned local commit with one signed commit on top of the remote tip.
          git fetch origin gh-pages
          git checkout gh-pages
          git reset --soft FETCH_HEAD
          if git diff --cached --quiet; then
            echo "No benchmark changes to publish."
            exit 0
          fi
          git commit -S -m "add benchmark results for ${COMMIT_SHA}"

          _attempt=1
          until git push origin gh-pages:gh-pages; do
            if [ "${_attempt}" -ge 3 ]; then
              echo "::error::Failed to push gh-pages after 3 attempts." >&2
              exit 1
            fi
            _attempt=$((_attempt + 1))
            git fetch origin gh-pages
            git rebase -S FETCH_HEAD
          done
